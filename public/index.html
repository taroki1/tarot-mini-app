<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6B46C1">
    <meta name="description" content="Профессиональные тарологи - выпускники нашей школы. Найдите своего специалиста для консультации по картам Таро.">

    <title>Эксперты Таро - Каталог тарологов</title>

    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">

    <style>
        /* Базовые стили для предотвращения мигания */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #F7F4FF;
            color: #333;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
        }

        /* Индикатор загрузки */
        .app-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6B46C1 0%, #9B7BC1 100%);
            color: white;
        }

        .loading-spinner {
            font-size: 64px;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Корневой элемент для React приложения -->
    <div id="root">
        <!-- Индикатор загрузки до монтирования React -->
        <div class="app-loading">
            <div class="loading-spinner">🔮</div>
            <div class="loading-text">Загружаем приложение...</div>
        </div>
    </div>

    <!-- Webpack автоматически добавит скрипты здесь -->
</body>
</html>
